# Canonical Dependabot configuration (matchory supply chain baseline).
#
# Every ecosystem entry follows the same three rules:
#   - cooldown: a release must be 3 days old before Dependabot proposes it
#     (does not delay security updates)
#   - minor + patch updates arrive as ONE grouped PR per ecosystem; npm,
#     composer, pip and bundler split that into production and development
#     PRs (the ecosystems where Dependabot supports `dependency-type`), so a
#     runtime bump is reviewed apart from a tooling bump
#   - major updates are never grouped: one PR per dependency, so each breaking
#     change is reviewed on its own
# Security updates get their own group per ecosystem; without it every
# advisory arrives as a separate PR.
#
# No YAML anchors or aliases: Dependabot rejects the whole file if it has one,
# so every block is spelled out.
#
# Copy the blocks for the ecosystems the repo actually has. A github-actions
# block without .github/workflows/*.yml or a root action.yml fails every run
# ("/action.yml not found").
# Use `directories:` with globs when manifests live below the root, e.g.
# ["/", "/packages/*"]; `directory: /` covers the root only.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directories: ["/", "/**/docker"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    # Production and development dependencies in separate groups. Only for
    # ecosystems that support `dependency-type`: composer, npm, pip, bundler.
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    versioning-strategy: increase-if-necessary
    labels: [dependencies, php]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    versioning-strategy: increase-if-necessary
    labels: [dependencies, javascript]

  # uv.lock present -> "uv"; requirements.txt / poetry / pipenv -> "pip".
  # pip supports `dependency-type`, so a pip entry uses *split-groups; uv does
  # not, so it keeps the single minor-and-patch group.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, go]

  - package-ecosystem: terraform
    directories: ["/tofu", "/tofu/**"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, terraform]

  - package-ecosystem: helm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, helm]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, ruby]
