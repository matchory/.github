# Runs the supply chain audit across the org every weekday and keeps one open
# issue (label supply-chain-drift) up to date with regressions since the
# previous run. The audit reads org and repo settings through a read-only
# GitHub App; the issue is written with this repo's own token.
name: Supply chain drift

on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-drift

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUPPLY_CHAIN_AUDIT_CLIENT_ID }}
          private-key: ${{ secrets.SUPPLY_CHAIN_AUDIT_APP_KEY }}
          # the audit reads every repo, so the token spans the org (read-only below)
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-administration: read
          permission-contents: read
          permission-organization-administration: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # Daily runs keep this cache from being evicted (7 days unused).
      - name: Restore the previous report
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous
          key: supply-chain-report-${{ github.run_id }}
          restore-keys: supply-chain-report-

      - name: Audit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          uv tool install zizmor==1.30.1
          # Enterprise settings need admin:enterprise, which an org app cannot hold.
          uv run --script supply-chain/audit.py --enterprise '' --refresh --previous previous/report.json

      - name: Keep this report for the next run
        run: mkdir -p previous && cp supply-chain/report.json previous/report.json

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous
          key: supply-chain-report-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: |
            supply-chain/report.md
            supply-chain/report.json
            supply-chain/drift.md

      - name: Update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sed -i "s|the \`report\` artifact of this run|the \`report\` artifact of [this run](${RUN_URL})|" supply-chain/drift.md
          gh label create supply-chain-drift --color B60205 --description "Supply chain baseline drift" --force
          issue=$(gh issue list --label supply-chain-drift --state open --json number --jq '.[0].number // empty')
          if [[ -n "${issue}" ]]; then
            gh issue edit "${issue}" --body-file supply-chain/drift.md
          else
            gh issue create --title "Supply chain baseline drift" --label supply-chain-drift --body-file supply-chain/drift.md
          fi
